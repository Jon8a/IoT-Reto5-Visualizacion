# ─────────────────────────────────────────
# LOGSTASH PIPELINE - Fleet IoT
# Recibe datos del script Python via TCP
# y los indexa en Elasticsearch
# ─────────────────────────────────────────

input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Añade timestamp de procesado por Logstash
  mutate {
    add_field => { "processed_by" => "logstash" }
  }

  # Valida que la velocidad no sea negativa
  if [speed_kmh] < 0 {
    mutate {
      update => { "speed_kmh" => 0 }
      add_tag => ["invalid_speed_corrected"]
    }
  }

  # Clasifica el estado de temperatura del motor
  if [engine_temp_c] > 100 {
    mutate { add_field => { "temp_status" => "critical" } }
  } else if [engine_temp_c] > 85 {
    mutate { add_field => { "temp_status" => "warning" } }
  } else {
    mutate { add_field => { "temp_status" => "normal" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "fleet-vehicles-%{+YYYY.MM.dd}"
  }

  # Log en consola para debug (útil en demo)
  stdout {
    codec => rubydebug
  }
}
