version: "3.8"

services:

  # ─────────────────────────────────────────
  # ELASTICSEARCH
  # ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    environment:
      - node.name=es-node-1
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false   # SSL desactivado para simplificar dev
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT}:9200"
    networks:
      - elastic-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────
  # KIBANA
  # ─────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_SECURITY_ENABLED=true
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=fleet-iot-32char-encryption-key-for-kibana!!
      - XPACK_SECURITY_ENCRYPTIONKEY=fleet-iot-32char-encryption-key-for-kibana!!
      - XPACK_REPORTING_ENCRYPTIONKEY=fleet-iot-32char-encryption-key-for-kibana!!
    ports:
      - "${KIBANA_PORT}:5601"
    networks:
      - elastic-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ─────────────────────────────────────────
  # LOGSTASH
  # ─────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "${LOGSTASH_PORT}:5044"
    networks:
      - elastic-net

  # ─────────────────────────────────────────
  # SETUP: crea usuarios y roles al arrancar
  # ─────────────────────────────────────────
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - OPERATOR_PASSWORD=${OPERATOR_PASSWORD}
      - DRIVER_PASSWORD=${DRIVER_PASSWORD}
    networks:
      - elastic-net
    command: >
      bash -c '
        echo "Configurando contraseña de kibana_system...";
        curl -s -X POST -u elastic:$$ELASTIC_PASSWORD \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"$$KIBANA_PASSWORD\"}";

        echo "Creando rol operador (solo lectura)...";
        curl -s -X POST -u elastic:$$ELASTIC_PASSWORD \
          http://elasticsearch:9200/_security/role/operador \
          -H "Content-Type: application/json" \
          -d "{\"cluster\":[\"monitor\"],\"indices\":[{\"names\":[\"fleet-*\"],\"privileges\":[\"read\",\"view_index_metadata\"]}],\"applications\":[{\"application\":\"kibana-.kibana\",\"privileges\":[\"read\"],\"resources\":[\"*\"]}]}";

        echo "Creando usuario operador...";
        curl -s -X POST -u elastic:$$ELASTIC_PASSWORD \
          http://elasticsearch:9200/_security/user/operador \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"$$OPERATOR_PASSWORD\",\"roles\":[\"operador\"],\"full_name\":\"Operador de Flota\"}";

        echo "Creando Index Template para fleet-vehicles-*...";
        curl -s -X PUT -u elastic:$$ELASTIC_PASSWORD \
          "http://elasticsearch:9200/_index_template/fleet-template" \
          -H "Content-Type: application/json" \
          -d "{\"index_patterns\":[\"fleet-vehicles-*\"],\"template\":{\"settings\":{\"number_of_shards\":1,\"number_of_replicas\":0},\"mappings\":{\"properties\":{\"@timestamp\":{\"type\":\"date\"},\"vehicle_id\":{\"type\":\"keyword\"},\"driver\":{\"type\":\"keyword\"},\"route_name\":{\"type\":\"keyword\"},\"location\":{\"type\":\"geo_point\"},\"speed_kmh\":{\"type\":\"float\"},\"engine_temp_c\":{\"type\":\"float\"},\"fuel_level_pct\":{\"type\":\"float\"},\"status\":{\"type\":\"keyword\"},\"temp_status\":{\"type\":\"keyword\"},\"processed_by\":{\"type\":\"keyword\"}}}}}";

        echo "Activando licencia Trial para funciones avanzadas (DLS)...";
        curl -s -X POST -u elastic:$$ELASTIC_PASSWORD \
          "http://elasticsearch:9200/_license/start_trial?acknowledge=true" \
          -H "Content-Type: application/json";

        echo "Creando rol conductor (solo su vehiculo)...";
        curl -s -X POST -u elastic:$$ELASTIC_PASSWORD \
          http://elasticsearch:9200/_security/role/conductor \
          -H "Content-Type: application/json" \
          -d "{\"cluster\":[\"monitor\"],\"indices\":[{\"names\":[\"fleet-*\"],\"privileges\":[\"read\"],\"query\":\"{\\\"template\\\":{\\\"source\\\":{\\\"term\\\":{\\\"driver\\\":\\\"{{_user.full_name}}\\\"}}}}\"}],\"applications\":[{\"application\":\"kibana-.kibana\",\"privileges\":[\"read\"],\"resources\":[\"*\"]}]}";

        echo "Creando usuario conductor...";
        curl -s -X POST -u elastic:$$ELASTIC_PASSWORD \
          http://elasticsearch:9200/_security/user/conductor \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"$$DRIVER_PASSWORD\",\"roles\":[\"conductor\"],\"full_name\":\"Conductor-1\"}";

        echo "Setup completado!";
      '
    restart: on-failure

  # ─────────────────────────────────────────
  # SIMULATOR: envía datos a Logstash
  # ─────────────────────────────────────────
  simulator:
    build: .
    container_name: simulator
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
    networks:
      - elastic-net
    command: python scripts/simulate_fleet.py

  # ─────────────────────────────────────────
  # KIBANA SETUP: configura dashboards
  # ─────────────────────────────────────────
  kibana-setup:
    build: .
    container_name: kibana-setup
    depends_on:
      kibana:
        condition: service_healthy
      simulator:
        condition: service_started
    environment:
      - KIBANA_HOST=kibana
      - KIBANA_PORT=5601
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    networks:
      - elastic-net
    command: python scripts/setup_kibana.py

volumes:
  esdata:
    driver: local

networks:
  elastic-net:
    driver: bridge
